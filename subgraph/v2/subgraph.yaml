specVersion: 1.3.0
description:
  ParamShield Sepolia v2 market, state versions, authorization epochs and
  guarded execution lifecycle. The historical v1 index remains separate.
repository: https://github.com/thunderxu7-sketch/paramshield
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ReferenceLendingMarket
    network: sepolia
    source:
      address: "0x9e268E23cb6ecce47E2482D6Ce222068b03Af35a"
      abi: ReferenceLendingMarket
      startBlock: 11660450
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Market, Position, MarketEvent]
      abis:
        - name: ReferenceLendingMarket
          file: ../../deployments/v2/abi/ReferenceLendingMarket.json
      eventHandlers:
        - event: MarketStateUpdated(uint256)
          handler: handleStateUpdated
        - event: PositionUpdated(indexed address,uint256,uint256,uint256)
          handler: handlePositionUpdated
        - event: LiquidationThresholdUpdated(uint16,uint16,indexed address)
          handler: handleThresholdUpdated
        - event: CollateralPriceUpdated(uint256,uint256,indexed address)
          handler: handlePriceUpdated
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/market.ts
  - kind: ethereum/contract
    name: ParamShieldExecutor
    network: sepolia
    source:
      address: "0xD971505e814235b668fB56d7000492a9c68D9749"
      abi: ParamShieldExecutor
      startBlock: 11660450
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Change, ProposalPrecondition, Executor, AllowedCall]
      abis:
        - name: ParamShieldExecutor
          file: ../../deployments/v2/abi/ParamShieldExecutor.json
      eventHandlers:
        - event: ProposalPreconditions(indexed bytes32,uint256,uint256)
          handler: handleProposalPreconditions
        - event: AuthorizationEpochUpdated(uint256)
          handler: handleEpochUpdated
        - event: OperatorUpdated(indexed address,indexed address)
          handler: handleOperatorUpdated
        - event: DecisionAuthorityUpdated(indexed address,indexed address)
          handler: handleAuthorityUpdated
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleAdminUpdated
        - event: AllowedCallUpdated(indexed address,indexed bytes4,bool)
          handler: handleAllowedCallUpdated
        - event:
            ProposalCreated(indexed bytes32,indexed address,indexed
            address,bytes4,bytes32,uint256,bytes32,uint64)
          handler: handleProposalCreated
        - event: DecisionRecorded(indexed bytes32,uint8,indexed bytes32,uint8)
          handler: handleDecisionRecorded
        - event: ProposalExecuted(indexed bytes32,indexed address,bytes32)
          handler: handleProposalExecuted
        - event: ProposalMarkedExpired(indexed bytes32)
          handler: handleProposalExpired
      file: ./src/executor.ts
